<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mojo — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ============================================================
   TOKENS — identical to the Mojo design system
   ============================================================ */
:root, .light {
  --background: #fffffe;
  --foreground: #1b2d45;
  --headline: #00214d;
  --card: #f2f4f6;
  --card-foreground: #00214d;
  --popover: #fffffe;
  --popover-foreground: #00214d;
  --primary: #00ebc7;
  --primary-foreground: #00214d;
  --secondary: #ff5470;
  --secondary-foreground: #fffffe;
  --tertiary: #fde24f;
  --tertiary-foreground: #00214d;
  --muted: #f2f4f6;
  --muted-foreground: color-mix(in oklab, #1b2d45 72%, #fffffe);
  --accent: color-mix(in oklab, #00ebc7 16%, #fffffe);
  --accent-foreground: #00214d;
  --destructive: #ff5470;
  --destructive-foreground: #fffffe;
  --border: color-mix(in oklab, #00214d 12%, #fffffe);
  --input: color-mix(in oklab, #00214d 16%, #fffffe);
  --ring: #00ebc7;
  --radius: 0.75rem;
  --font-display: 'Manrope', sans-serif;
  --font-sans: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --radius-lg: var(--radius);
  --radius-md: calc(var(--radius) - 0.25rem);
  --radius-sm: calc(var(--radius) - 0.4rem);
}
.dark {
  --background: #001534;
  --foreground: color-mix(in oklab, #fffffe 88%, #001534);
  --headline: #fffffe;
  --card: #00214d;
  --card-foreground: color-mix(in oklab, #fffffe 92%, #001534);
  --popover: #00214d;
  --popover-foreground: color-mix(in oklab, #fffffe 92%, #001534);
  --primary: #00ebc7;
  --primary-foreground: #00214d;
  --secondary: #ff5470;
  --secondary-foreground: #fffffe;
  --tertiary: #fde24f;
  --tertiary-foreground: #00214d;
  --muted: color-mix(in oklab, #00214d 55%, #001534);
  --muted-foreground: color-mix(in oklab, #fffffe 62%, #001534);
  --accent: color-mix(in oklab, #00ebc7 20%, #00214d);
  --accent-foreground: #fffffe;
  --destructive: #ff5470;
  --destructive-foreground: #fffffe;
  --border: color-mix(in oklab, #fffffe 14%, transparent);
  --input: color-mix(in oklab, #fffffe 22%, transparent);
  --ring: #00ebc7;
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
body {
  margin: 0; background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: 14.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; transition: background .25s ease, color .25s ease;
}
h1, h2, h3 { font-family: var(--font-display); color: var(--headline); margin: 0; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); }

/* ============================================================
   SHELL
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 40; height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
  background: color-mix(in oklab, var(--background) 88%, transparent); backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--headline); flex-shrink: 0; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 25%, transparent); }

.role-switch { display: flex; gap: 3px; background: var(--muted); padding: 3px; border-radius: 999px; }
.role-switch button {
  border: none; background: transparent; font-family: var(--font-sans); font-weight: 700; font-size: 12.5px;
  color: var(--muted-foreground); padding: 7px 16px; border-radius: 999px; cursor: pointer;
}
.role-switch button.active { background: var(--background); color: var(--headline); box-shadow: 0 1px 4px color-mix(in oklab, var(--headline) 15%, transparent); }

.topbar-right { display: flex; align-items: center; gap: 10px; }
.theme-switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 1px solid var(--border); background: var(--muted); cursor: pointer; padding: 0; flex-shrink: 0; }
.theme-switch .thumb { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; transition: transform .25s cubic-bezier(.4,0,.2,1); }
.dark .theme-switch .thumb { transform: translateX(20px); }
.theme-switch svg { width: 12px; height: 12px; }
.menu-btn { display: none; width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--foreground); align-items: center; justify-content: center; cursor: pointer; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--tertiary); color: var(--tertiary-foreground); font-family: var(--font-display); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.shell { display: flex; max-width: 1280px; margin: 0 auto; }
.sidenav { width: 216px; flex-shrink: 0; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; padding: 22px 14px; border-right: 1px solid var(--border); }
.sidenav .grp { margin-bottom: 18px; }
.sidenav .grp-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted-foreground); padding: 0 10px; margin-bottom: 5px; display: block; }
.sidenav a { display: block; text-decoration: none; font-size: 13px; color: var(--foreground); padding: 6px 10px; border-radius: var(--radius-sm); font-weight: 500; cursor: default; }
.sidenav a.active { background: var(--accent); color: var(--accent-foreground); }
.sidenav a:not(.active):hover { background: var(--muted); }

.content { flex: 1; min-width: 0; padding: 24px 24px 80px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
.page-head h1 { font-size: 24px; font-weight: 800; }
.page-head .date { font-size: 12.5px; color: var(--muted-foreground); margin-top: 3px; }
.quick-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ============================================================
   COMPONENTS (shared with the design system)
   ============================================================ */
.btn { font-family: var(--font-sans); font-weight: 700; font-size: 13px; border-radius: var(--radius-md); border: 1px solid transparent; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: box-shadow .12s ease, transform .12s ease; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { box-shadow: 0 8px 18px -8px color-mix(in oklab, var(--primary) 70%, transparent); }
.btn-outline { background: transparent; border-color: var(--input); color: var(--headline); }
.btn-outline:hover { background: var(--muted); }

.badge { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.badge-primary { background: var(--primary); color: var(--primary-foreground); }
.badge-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.badge-tertiary { background: var(--tertiary); color: var(--tertiary-foreground); }
.badge-destructive { background: var(--destructive); color: var(--destructive-foreground); }
.badge-muted { background: var(--muted); color: var(--muted-foreground); }
.badge-outline { background: transparent; border: 1px solid var(--border); color: var(--foreground); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 26px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
.stat-card .eyebrow { margin-bottom: 8px; }
.stat-value { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--headline); line-height: 1; }
.stat-foot { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
.stat-note { font-size: 11.5px; color: var(--muted-foreground); }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-head h3 { font-size: 14.5px; font-weight: 700; }
.ds-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ds-table th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); font-weight: 500; padding: 10px 18px; }
.ds-table td { padding: 11px 18px; border-top: 1px solid var(--border); color: var(--foreground); }
.ds-table tr:hover td { background: var(--muted); }

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 900px) {
  .brand span.tag, .avatar { display: none; }
  .menu-btn { display: flex; }
  .sidenav { position: fixed; top: 60px; left: 0; height: calc(100vh - 60px); width: 78vw; max-width: 290px; background: var(--popover); z-index: 39; transform: translateX(-100%); transition: transform .25s ease; box-shadow: 10px 0 30px color-mix(in oklab, var(--headline) 20%, transparent); }
  .sidenav.open { transform: translateX(0); }
  .content { padding: 18px 16px 70px; }
  .role-switch button { padding: 6px 11px; font-size: 11.5px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> Mojo <span class="tag mono" style="font-weight:400;font-size:11px;color:var(--muted-foreground);">dashboard</span></div>
  <div class="role-switch" id="roleSwitch" role="tablist" aria-label="Preview role">
    <button role="tab" data-role="admin" aria-selected="true">Admin</button>
    <button role="tab" data-role="tutor" aria-selected="false">Tutor</button>
    <button role="tab" data-role="student" aria-selected="false">Student</button>
  </div>
  <div class="topbar-right">
    <button class="theme-switch" id="themeToggle" aria-pressed="false" aria-label="Toggle dark mode">
      <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span>
    </button>
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="avatar" id="avatar">A</div>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" id="sidenav"></nav>
  <main class="content" id="content"></main>
</div>

<script>
const ROLES = {
  admin: {
    label: 'Admin', initial: 'A', greeting: 'Good morning',
    nav: [
      { group: 'Overview', items: ['Overview'] },
      { group: 'Tutors', items: ['Application queue', 'Directory', 'Levels & progression', 'Suspensions'] },
      { group: 'Students', items: ['Directory', 'Suspensions'] },
      { group: 'Sessions', items: ['All bookings', 'Disputes', 'Cancellation log'] },
      { group: 'Finance', items: ['Wallets & transactions', 'Payout approvals', 'Commission & pricing', 'Mojo+ config', 'Revenue reports'] },
      { group: 'Marketplace', items: ['Subjects & languages', 'Referral program', 'Trial discount rules', 'Featured tutors'] },
      { group: 'Analytics', items: ['Platform metrics', 'Tutor leaderboard', 'Retention'] },
      { group: 'System', items: ['Admin roles', 'Feature flags', 'Broadcasts', 'Audit log'] },
    ],
    stats: [
      { label: 'Pending applications', value: '12', badge: ['primary','3 waiting > 48h'] },
      { label: 'Open disputes', value: '4', badge: ['destructive','1 flagged urgent'] },
      { label: 'Revenue this period', value: '₦1.84M', badge: ['tertiary','+18% vs last period'] },
      { label: 'Active tutors', value: '206', badge: ['primary','+14 this week'] },
      { label: 'Mojo+ subscribers', value: '38', badge: ['tertiary','₦228,000 MRR'] },
      { label: 'Flagged content', value: '2', badge: ['destructive','AI recaps to review'] },
    ],
    quick: [['Review next application','primary'],['Resolve oldest dispute','outline'],['Send a broadcast','outline']],
    table: { title: 'Application queue', cols: ['Applicant','Subject','Submitted','Status'], rows: [
      ['Amaka O.','Spanish · Conversational','2h ago',['pending','tertiary']],
      ['Tunde B.','Mathematics · JAMB prep','5h ago',['pending','tertiary']],
      ['Grace N.','French · Beginner','1d ago',['in review','muted']],
      ['Segun A.','English · IELTS prep','1d ago',['pending','tertiary']],
    ]},
  },
  tutor: {
    label: 'Tutor', initial: 'K', greeting: 'Good morning, Kelechi',
    nav: [
      { group: 'Overview', items: ['Overview'] },
      { group: 'Calendar', items: ['Availability', 'Upcoming sessions', 'Past sessions'] },
      { group: 'Students', items: ['Roster', 'Messages', 'Trial requests'] },
      { group: 'Earnings', items: ['Wallet & transactions', 'Payouts', 'Level & Mojo+'] },
      { group: 'Profile', items: ['Application/profile', 'Subjects'] },
      { group: 'Performance', items: ['My stats', 'Reviews'] },
      { group: 'Referrals', items: ['Link & rewards'] },
    ],
    stats: [
      { label: "Today's sessions", value: '4', badge: ['primary','next in 25 min'] },
      { label: 'Earnings this period', value: '₦186,400', badge: ['tertiary','Established level'] },
      { label: 'Wallet balance', value: '₦42,000', badge: ['primary','ready to withdraw'] },
      { label: 'Level progress', value: '142/200 hrs', badge: ['tertiary','→ Expert'] },
      { label: 'Trial requests', value: '2', badge: ['secondary','respond within 24h'] },
      { label: 'Unread messages', value: '3', badge: ['muted','from 2 students'] },
    ],
    quick: [['Set today\'s availability','primary'],['Respond to trial request','outline'],['Withdraw funds','outline'],['Upgrade to Mojo+','outline']],
    table: { title: "Today's sessions", cols: ['Student','Subject','Time','Status'], rows: [
      ['Ifeoma A.','Conversational Spanish','10:00 AM',['confirmed','primary']],
      ['David K. (trial)','Spanish Grammar Basics','1:30 PM',['trial','secondary']],
      ['Chiamaka R.','Spanish for Travel','4:00 PM',['confirmed','primary']],
      ['Wale S.','Conversational Spanish','6:15 PM',['confirmed','primary']],
    ]},
  },
  student: {
    label: 'Student', initial: 'D', greeting: 'Welcome back, David',
    nav: [
      { group: 'Overview', items: ['Overview'] },
      { group: 'Find a tutor', items: ['Search & filters', 'Favorites'] },
      { group: 'My tutors', items: ['Booked tutors', 'Message history'] },
      { group: 'Lessons', items: ['Upcoming', 'History', 'Recaps & practice'] },
      { group: 'Payments', items: ['Payment methods', 'Subscription', 'History & receipts'] },
      { group: 'Referrals', items: ['Link & rewards'] },
    ],
    stats: [
      { label: 'Next lesson', value: 'in 25 min', badge: ['primary','Conversational Spanish'] },
      { label: 'Latest recap', value: 'Ready', badge: ['tertiary','from Tuesday\'s lesson'] },
      { label: 'Daily practice', value: '2 due', badge: ['secondary','due today'] },
      { label: 'Saved tutors', value: '5', badge: ['muted','2 new this week'] },
      { label: 'Subscription', value: 'Active', badge: ['primary','8 lessons / month'] },
    ],
    quick: [['Join now','primary'],['Book a trial lesson','outline'],['Message a tutor','outline'],['Leave a review','outline']],
    table: { title: 'Upcoming lessons', cols: ['Tutor','Subject','Date','Time'], rows: [
      ['Ifeoma A.','Conversational Spanish','Today','2:00 PM'],
      ['Ifeoma A.','Conversational Spanish','Fri 4 Sep','2:00 PM'],
      ['David K. (trial)','Spanish Grammar Basics','Mon 7 Sep','10:00 AM'],
    ]},
  },
};

function render(roleKey) {
  const r = ROLES[roleKey];
  document.getElementById('avatar').textContent = r.initial;

  document.getElementById('sidenav').innerHTML = r.nav.map((g, gi) => `
    <div class="grp">
      <span class="grp-label">${g.group}</span>
      ${g.items.map((item, ii) => `<a href="#" class="${gi===0 && ii===0 ? 'active' : ''}">${item}</a>`).join('')}
    </div>`).join('');

  const statCards = r.stats.map(s => `
    <div class="stat-card">
      <div class="eyebrow">${s.label}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-foot"><span class="badge badge-${s.badge[0]}">${s.badge[1]}</span></div>
    </div>`).join('');

  const quickBtns = r.quick.map(([label, style]) => `<button class="btn btn-${style}">${label}</button>`).join('');

  const tableRows = r.table.rows.map(row => `
    <tr>${row.map(cell => Array.isArray(cell)
      ? `<td><span class="badge badge-${cell[1]}">${cell[0]}</span></td>`
      : `<td>${cell}</td>`).join('')}</tr>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="page-head">
      <div><h1>${r.greeting}</h1><div class="date mono">Friday, 28 August 2026</div></div>
      <div class="quick-row">${quickBtns}</div>
    </div>
    <div class="stat-grid">${statCards}</div>
    <div class="panel">
      <div class="panel-head"><h3>${r.table.title}</h3><span class="eyebrow">${r.table.rows.length} shown</span></div>
      <table class="ds-table">
        <thead><tr>${r.table.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

const roleSwitch = document.getElementById('roleSwitch');
roleSwitch.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-role]');
  if (!btn) return;
  roleSwitch.querySelectorAll('button').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  btn.classList.add('active'); btn.setAttribute('aria-selected','true');
  render(btn.dataset.role);
  closeNav();
});
document.querySelector('.role-switch button[data-role="admin"]').classList.add('active');
render('admin');

document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('themeToggle').setAttribute('aria-pressed', String(isDark));
});

const sidenav = document.getElementById('sidenav');
function closeNav() { sidenav.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click', () => sidenav.classList.toggle('open'));
</script>
</body>
</html>
